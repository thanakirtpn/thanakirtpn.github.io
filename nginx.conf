server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # เสิร์ฟไฟล์ตรง ๆ ก่อน แล้วค่อย fallback ไป index.html (เหมาะกับ SPA/ลิงก์ภายใน)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # วิดีโอ/มีเดีย
    location ~* \.(mp4|webm|ogg)$ {
        # (mime.types ถูก include อยู่แล้วใน nginx:alpine แต่ย้ำ cache headers ให้ชัด)
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        gzip off;               # ห้าม gzip ไฟล์มีเดีย
        try_files $uri =404;
    }

    # ไฟล์ static อื่น ๆ
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        try_files $uri =404;
    }
}
